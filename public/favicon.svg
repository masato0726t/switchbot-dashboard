<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="merc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="55%" stop-color="#ff5a4d"/>
      <stop offset="100%" stop-color="#e0245e"/>
    </linearGradient>
  </defs>

  <!-- ガラス管の本体（外形） -->
  <path d="M16 3
           a5 5 0 0 1 5 5
           v11.4
           a7 7 0 1 1 -10 0
           V8
           a5 5 0 0 1 5 -5 z"
        fill="#ffffff" stroke="#5a6b7b" stroke-width="2"/>

  <!-- 水銀柱（赤い液体） -->
  <path d="M16 11
           v8.9
           a7 7 0 1 1 0 0 z"
        fill="none"/>
  <circle cx="16" cy="24" r="4.6" fill="url(#merc)"/>
  <rect x="13.8" y="11" width="4.4" height="11" rx="2.2" fill="url(#merc)"/>

  <!-- 目盛り -->
  <g stroke="#5a6b7b" stroke-width="1.4" stroke-linecap="round">
    <line x1="21" y1="9"  x2="23.4" y2="9"/>
    <line x1="21" y1="12.5" x2="22.8" y2="12.5"/>
    <line x1="21" y1="16" x2="23.4" y2="16"/>
    <line x1="21" y1="19.5" x2="22.8" y2="19.5"/>
  </g>
</svg>
