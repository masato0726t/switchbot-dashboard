name: CI

# main への push と、すべての Pull Request でテストを実行する。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # フロントの ESM（.js）はモジュール構文の自動判定に依存するため Node 20+ が必須。
        # package.json の engines（>=20）に合わせ、現行 LTS を検証する。
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
